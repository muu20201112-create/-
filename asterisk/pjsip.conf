; ========================================
; PJSIP 設定 - SIP トランク接続例
; /etc/asterisk/pjsip.conf に追加
; ========================================

; --- トランスポート ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ========================================
; SIP トランク設定（プロバイダー例）
; ========================================

[trunk-provider]
type=registration
transport=transport-udp
outbound_auth=trunk-provider-auth
server_uri=sip:sip.example-provider.jp
client_uri=sip:09012345678@sip.example-provider.jp
retry_interval=60

[trunk-provider-auth]
type=auth
auth_type=userpass
username=09012345678
password=your_password_here

[trunk-provider-aor]
type=aor
contact=sip:sip.example-provider.jp

[trunk-provider-endpoint]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw
allow=alaw
allow=g729
outbound_auth=trunk-provider-auth
aors=trunk-provider-aor
direct_media=no
trust_id_outbound=yes

; ========================================
; 内線（オペレーター用）
; ========================================

[100]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=100-auth
aors=100-aor

[100-auth]
type=auth
auth_type=userpass
username=100
password=operator_password

[100-aor]
type=aor
max_contacts=1
