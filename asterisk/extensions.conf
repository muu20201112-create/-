; ========================================
; 電話自動応答システム - Asterisk ダイアルプラン
; /etc/asterisk/extensions.conf に追加またはインクルード
; ========================================

[globals]
; オペレーター内線番号
OPERATOR_EXT=100
; AGI スクリプトのパス
AGI_SCRIPT=auto_response.py

[auto-response]
; 自動応答エントリーポイント
; SIP トランクの着信をここに向ける

exten => s,1,NoOp(自動応答システム起動)
 same => n,Set(CHANNEL(language)=ja)
 same => n,AGI(${AGI_SCRIPT})
 same => n,GotoIf($["${AUTO_RESPONSE_ACTION}" = "transfer"]?transfer,1)
 same => n,Hangup()

; オペレーター転送
exten => transfer,1,NoOp(オペレーターへ転送: ${TRANSFER_DEST})
 same => n,Dial(SIP/${TRANSFER_DEST},30,tTrm)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy,1)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer,1)
 same => n,Hangup()

; 話中時
exten => busy,1,Playback(custom/operator_busy)
 same => n,Hangup()

; 応答なし時
exten => noanswer,1,Playback(custom/operator_noanswer)
 same => n,Hangup()

; ========================================
; SIP トランク設定例（着信ルーティング）
; ========================================

[from-trunk]
; SIP トランクからの着信を自動応答コンテキストへルーティング
exten => _X.,1,NoOp(着信番号: ${EXTEN})
 same => n,Goto(auto-response,s,1)
